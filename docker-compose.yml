services:
  shim:
    build: .
    image: sparkyfitness-mcp-oauth-bridge:local
    container_name: sparkyfitness-mcp-oauth
    env_file:
      - ./shim.env
    volumes:
      - ./data:/data
    networks:
      - sparkyfitness-network
    restart: always
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8080/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Example Traefik labels — change the host to your own and adapt to your proxy.
    labels:
      - traefik.enable=true
      - traefik.http.routers.sparkymcpoauth.rule=Host(`mcp-oauth.example.com`)
      - traefik.http.services.sparkymcpoauth.loadbalancer.server.port=8080

# Join the existing Docker network that the SparkyFitness stack created, so this
# bridge can reach `sparkyfitness-mcp` and `sparkyfitness-db` by name.
networks:
  sparkyfitness-network:
    external: true
    name: sparkyfitness_sparkyfitness-network
